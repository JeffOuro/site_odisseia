[providers]
    - "php"

[phases.build]
    cmds = [
        "npm run build",
        "touch database/database.sqlite",
        "php artisan migrate --force",
        "php artisan config:cache",
        "php artisan route:cache",
        "php artisan view:cache"
    ]

[start]
    cmd = "php artisan queue:work --daemon & caddy run --config /etc/caddy/Caddyfile --adapter caddyfile & php-fpm -y /etc/php-fpm.conf"
